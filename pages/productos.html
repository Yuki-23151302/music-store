<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | Kookstore.mx</title>

    <!-- Fuentes de Google -->
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="../css/estilos.css">
    <!-- CSS del catálogo (etiquetas, tarjetas) -->
    <link rel="stylesheet" href="../css/estiloscatalogo.css">
    <!-- CSS exclusivo de la ficha de producto -->
    <link rel="stylesheet" href="../css/estilosdetalle.css">

    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon">
</head>

<body>

    <!-- CABECERA (HEADER) -->
    <header class="header-principal">
        <div class="logo-container">
            <a href="../index.html">
                <img src="../assets/img/logo.png" alt="Logo Kookstore" class="logo-img">
            </a>
        </div>
        <nav class="nav-principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nuestra-empresa.html">Nuestra Empresa</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="iconos-usuario">
            <a href="login.html" class="btn-login">Mi Cuenta</a>
            <a href="carrito.html" class="btn-carrito">Carrito (0)</a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="detalle-main">

        <!-- REGRESO AL CATÁLOGO -->
        <div class="detalle-migas">
            <a href="catalogo.html">&larr; Volver al Catálogo</a>
        </div>

        <!--
            AQUÍ SE DIBUJA ÚNICAMENTE EL PRODUCTO SELECCIONADO.
            El archivo js/detalle-producto.js lee el id que viene
            en la dirección (productos.html?id=...) y construye
            solo esa ficha: ningún otro producto existe en esta
            página.
        -->
        <div id="detalle-producto"></div>

    </main>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="footer-principal">
        <div class="footer-grid">
            <div class="footer-info">
                <h3>Kookstore.mx</h3>
                <p>Tu tienda confiable de K-pop en México.</p>
            </div>
            <div class="footer-enlaces">
                <h4>Enlaces Rápidos</h4>
                <ul>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="nuestra-empresa.html">Sobre Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </div>
            <div class="footer-legal">
                <h4>Ayuda</h4>
                <ul>
                    <li><a href="../index.html#faq">Preguntas Frecuentes</a></li>
                    <li><a href="#">Términos y Condiciones</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-copyright">
            <p>&copy; 2026 Kookstore.mx</p>
        </div>
    </footer>

    <!-- JAVASCRIPT (el orden importa) -->
    <script src="../js/datos-productos.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/detalle-producto.js"></script>

</body>

</html>
